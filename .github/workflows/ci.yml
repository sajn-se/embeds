name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # React, Vue and React Native read @sajn/embed-js from its build, so build before checking types.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm -r --filter "./packages/*" exec publint
      - run: pnpm -r --filter "./packages/*" run check-exports
