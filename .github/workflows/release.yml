name: Release

# Push a tag like v1.0.1 after bumping all four package versions to match it.
# A prerelease version, such as 1.0.0-beta.1, publishes under the `beta` tag, so `latest` doesn't move.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # React Native's tests import the built UMD bundle, so build first.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Check the tag matches every package version
        run: |
          for pkg in packages/*/package.json; do
            version=$(node -p "require('./$pkg').version")
            test "v$version" = "$GITHUB_REF_NAME" || { echo "$pkg is $version, tag is $GITHUB_REF_NAME"; exit 1; }
          done
      - run: pnpm -r --filter "./packages/*" publish --access public --no-git-checks --tag ${{ contains(github.ref_name, '-') && 'beta' || 'latest' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
